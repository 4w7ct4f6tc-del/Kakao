# Render Blueprint (render.com → New → Blueprint → pick this repo).
# Deploys the KAKAO API (same code as Firebase Functions) and the FFmpeg video service.
services:
  - type: web
    name: kakao-api
    runtime: node
    rootDir: functions
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RUN_PIPELINE_INLINE
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT   # Firebase console → Project settings → Service accounts → Generate key (paste JSON)
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: VIDEO_SERVICE_SECRET
        sync: false
      # Add the rest from functions/.env.example (AI, Twilio, Stripe, ...) in the Render dashboard.

  - type: web
    name: kakao-video-service
    runtime: docker
    rootDir: video-service
    healthCheckPath: /health
    envVars:
      - key: VIDEO_SERVICE_SECRET
        sync: false   # same value as kakao-api
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
