# Builds the generated app every time KAKAO commits a new design.json.
name: Build generated app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders
        run: flutter create --platforms=android,web --org com.kakao.generated .
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Owner admin APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk customer-app.apk
          flutter build apk --release --dart-define=ADMIN=true
          cp build/app/outputs/flutter-apk/app-release.apk admin-app.apk
      - run: flutter build web --release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: |
            customer-app.apk
            admin-app.apk
